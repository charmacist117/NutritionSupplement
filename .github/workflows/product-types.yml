name: 건강기능식품 전체 유형 갱신
on:
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * *'
permissions:
  contents: write
concurrency:
  group: product-type-catalog
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      FOODSAFETY_API_KEY: ${{ secrets.FOODSAFETY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 공식 API 인증키 확인
        run: test -n "$FOODSAFETY_API_KEY" || { echo 'FOODSAFETY_API_KEY 비밀값 등록이 필요합니다.'; exit 1; }
      - name: 공식 API 전체 유형 수집 및 검증
        run: node scripts/collectProductTypes.js
      - name: 완성본 게시
        shell: bash
        run: |
          if ! gh release view product-type-catalog > /dev/null 2>&1; then
            gh release create product-type-catalog --latest=false --title '건강기능식품 전체 유형 자료' --notes '식품안전나라 I0030 공식 API의 전체 기능지표성분 자료. 검증된 완성본만 게시합니다.'
          fi
          gh release upload product-type-catalog "수집자료/catalog-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json.gz"
